# ============================================================
#  SaamBiz — espace vendeur : configuration Nginx PROVISOIRE
#
#  À poser AVANT Certbot, le temps d'obtenir le certificat.
#  Remplacer : YOUR_DOMAIN par le vrai domaine (ex: app.saambiz.com)
#
#    cp deploy/nginx-http.conf /etc/nginx/sites-available/saambiz-vendeur
#    sed -i "s/YOUR_DOMAIN/app.saambiz.com/g" /etc/nginx/sites-available/saambiz-vendeur
#    ln -sf /etc/nginx/sites-available/saambiz-vendeur /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#    certbot --nginx -d app.saambiz.com
#
#  Puis le déploiement continu pose deploy/nginx.conf tout seul à chaque
#  poussée — il n'y a rien à recopier à la main ensuite.
#
#  Pourquoi deux fichiers : deploy/nginx.conf référence
#  /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem, qui n'existe pas tant que
#  Certbot n'est pas passé. Le poser trop tôt fait échouer `nginx -t` — et
#  comme un seul fichier invalide empêche de recharger TOUS les sites de la
#  machine, cela coupe aussi les autres domaines et le renouvellement des
#  certificats.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Validation ACME de Certbot (émission et renouvellement).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root  /var/www/saambiz-vendeur/dist;
    index index.html;

    # Application à page unique : /connexion, /produits, /commandes n'existent
    # pas comme fichiers sur le disque. Sans try_files, ouvrir un lien direct
    # ou recharger la page renvoie un 404 Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
