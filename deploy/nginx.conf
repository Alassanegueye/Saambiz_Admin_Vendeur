# ============================================================
#  SaamBiz — espace vendeur : configuration Nginx (VPS Ubuntu)
#
#  Remplacer : YOUR_DOMAIN par le vrai domaine (ex: app.saambiz.com)
#  Déposer dans : /etc/nginx/sites-available/saambiz-vendeur
#  Activer via  : ln -sf /etc/nginx/sites-available/saambiz-vendeur \
#                        /etc/nginx/sites-enabled/saambiz-vendeur
#
#  À POSER APRÈS CERTBOT. Les chemins /etc/letsencrypt/live/… n'existent
#  qu'une fois le certificat émis : utiliser deploy/nginx-http.conf pour le
#  premier passage. Ensuite, le déploiement continu repose ce fichier à chaque
#  poussée.
#
#  L'espace vendeur ne fait tourner aucun processus : `npm run build` produit
#  dist/, et Nginx le sert tel quel. Pas de conteneur, pas de port, rien à
#  redémarrer après un déploiement.
# ============================================================

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS ─────────────────────────────────────────────────────────────
server {
    # `listen … http2` et non `http2 on;` : cette seconde forme, pourtant la
    # seule recommandée aujourd'hui, n'existe qu'à partir de Nginx 1.25.1 —
    # Ubuntu 22.04 et 24.04 livrent 1.24, où elle fait échouer `nginx -t` sur
    # « unknown directive "http2" ».
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── Certificats Let's Encrypt (générés par Certbot) ──────────────────────
    #
    # L'include apporte le jeu TLS recommandé par Mozilla, tenu à jour par
    # Certbot. Ne pas redéclarer ssl_protocols ni ssl_prefer_server_ciphers
    # ici : Nginx refuse les doublons et `nginx -t` échouerait.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── En-têtes de sécurité ─────────────────────────────────────────────────
    #
    # ATTENTION : un `add_header` dans un bloc `location` ANNULE tous ceux du
    # bloc `server`, il ne s'y ajoute pas — et `always` n'y change rien, il ne
    # concerne que les codes d'erreur. Les quatre en-têtes ci-dessous sont donc
    # répétés dans chaque `location` qui pose un Cache-Control.
    #
    # Sans cette répétition, ils disparaissent exactement là où ils comptent :
    # sur le document principal, servi par `location = /index.html` via le
    # repli try_files. Constaté en production sur les deux autres interfaces —
    # zéro en-tête sur la page d'accueil, alors que la configuration semblait
    # correcte.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    # L'espace vendeur est une application privée : rien à indexer.
    add_header X-Robots-Tag              "noindex, nofollow"                            always;

    root  /var/www/saambiz-vendeur/dist;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;

    # ── Ce qui n'est PAS une route de l'application ──────────────────────────
    # Les adresses d'API ne sont pas des routes React. Si elles retombaient sur
    # index.html, un appel mal configuré recevrait du HTML là où il attend du
    # JSON, et l'écran afficherait une erreur générique au lieu de la vraie
    # panne. L'API vit sur api.saambiz.com, jamais ici.
    location /saambiz/ {
        return 404;
    }

    # ── Routes de l'application ──────────────────────────────────────────────
    # /connexion, /produits, /commandes n'existent pas sur le disque : React
    # Router les résout côté client. Sans try_files, ouvrir un lien direct ou
    # recharger la page renvoie un 404 Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache ────────────────────────────────────────────────────────────────
    # Les fichiers de dist/assets portent une empreinte dans leur nom : un
    # contenu modifié change de nom, on peut donc les garder un an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Répétés : le Cache-Control ci-dessus efface ceux du bloc server.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header X-Robots-Tag              "noindex, nofollow"                            always;
    }

    # index.html est le seul point d'entrée à revalider. Sans cette exception,
    # un vendeur garderait indéfiniment les anciens noms de fichiers après un
    # déploiement, donc une page blanche jusqu'à vidage du cache.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";

        # Répétés, et c'est ici que ça compte le plus : try_files renvoie
        # toutes les routes vers ce bloc, qui sert donc le document de chaque
        # page — l'écran de connexion compris.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header X-Robots-Tag              "noindex, nofollow"                            always;
    }

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/saambiz-vendeur-access.log combined;
    error_log  /var/log/nginx/saambiz-vendeur-error.log warn;
}
